          p.confirmDelFriend===f?e('span',{style:{display:'inline-flex',gap:3,alignItems:'center'}},e('button',{className:'btn btn-sm btn-danger',onClick:function(){p.removeFriend(f);},style:{padding:'2px 6px'}},e('i',{className:'fa-solid fa-check'})),e('button',{className:'btn btn-sm btn-outline',onClick:function(){p.setConfirmDelFriend(null);},style:{padding:'2px 6px'}},e('i',{className:'fa-solid fa-times'}))):e('button',{className:'btn btn-sm btn-danger',onClick:function(){p.removeFriend(f);},style:{padding:'2px 6px'}},e('i',{className:'fa-solid fa-times'}))
        );})
      ),
      e('div',{className:'form-row',style:{marginTop:8}},
        e('input',{className:'input input-md',placeholder:'New friend name...',value:p.newFriendName,onChange:function(ev){p.setNewFriendName(ev.target.value);},onKeyDown:function(ev){if(ev.key==='Enter')p.addFriend();}}),
        e('button',{className:'btn btn-primary',onClick:p.addFriend},e('i',{className:'fa-solid fa-plus'}),'Add')
      )
    ),
    e('div',{className:'card'},
      e('h2',null,e('i',{className:'fa-solid fa-circle-info',style:{marginRight:8}}),'How to Use'),
      e('ol',{style:{paddingLeft:20,fontSize:'.9rem',lineHeight:1.8}},
        e('li',null,'Add all friends on this tab'),
        e('li',null,'Go to Expenses \u2192 enter each expense with who paid and who participated'),
        e('li',null,'Check Summary \u2192 see who owes whom!'),
        e('li',null,'New quest? Click Clear to reset everything.')
      )
    )
  );
}

ReactDOM.render(e(App),document.getElementById('root'));
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/iou-slayer/sw.js').catch(function(){});}catch(x){}}
</script>
